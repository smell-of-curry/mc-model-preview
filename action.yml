name: 'Minecraft Model Preview'
description: 'Generate a preview of changed Minecraft models in a pull request.'
author: 'Smell of Curry'

inputs:
  github-token:
    description: 'The GitHub token to use for authentication.'
    required: true
  resource-pack-path:
    description: 'The path to the resource pack in the repository.'
    required: false
    default: '.'
  mode:
    description: 'Action mode: "render" to render models (default), "post" to post comment from downloaded artifact.'
    required: false
    default: 'render'
  artifact-path:
    description: 'Path to the downloaded artifact directory (required for "post" mode).'
    required: false

runs:
  using: 'node20'
  main: 'dist/index.js'

branding:
  icon: 'image'
  color: 'green'
